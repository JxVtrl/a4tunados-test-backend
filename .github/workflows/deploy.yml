name: Deploy Backend to VPS

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: majorssolutions
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t majorssolutions/a4tunados-backend:latest ./backend
          docker push majorssolutions/a4tunados-backend:latest

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 69.62.92.66
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/joao/a4tunados
            docker-compose down || true
            docker rm -f a4tunados_backend || true
            docker rm -f a4tunados_postgres || true
            docker volume prune -f
            docker pull majorssolutions/a4tunados-backend:latest
            docker-compose up -d --force-recreate

            # Espera o container subir e roda as migrações
            sleep 10
            docker exec a4tunados_backend python manage.py makemigrations --noinput
            docker exec a4tunados_backend python manage.py migrate --noinput
